name: NexusP2P Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install requests
      - name: Ejecutar Bot
        run: python scraper.py
      - name: Guardar datos
        run: |
          git config user.name  "nexusp2p-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/precios.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizar precios"
          git push
