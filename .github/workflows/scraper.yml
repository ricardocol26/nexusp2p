name: NexusP2P Bot
on:
  schedule:
    - cron: '0 * * * *'      # Corre cada hora en punto
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  precio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scraper.py
        env:
          COTIZAVE_API_KEY: ${{ secrets.COTIZAVE_API_KEY }}
      - run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "precio $(date -u +%FT%TZ)"
          git push
